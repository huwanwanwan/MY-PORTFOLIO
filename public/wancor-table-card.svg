  <text x="400" y="121" text-anchor="middle" fill="#D95338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Developer Profile &amp; Technical Directory</text>

