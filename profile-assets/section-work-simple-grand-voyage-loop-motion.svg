<svg xmlns="http://www.w3.org/2000/svg" width="960" height="80" viewBox="0 0 960 80" role="img" aria-labelledby="title"><style>
  @keyframes appear { 0%,100% { opacity: .82; } 15%,90% { opacity: 1; } }
  @keyframes rise { 0%,100% { transform: scaleY(.08); } 20%,90% { transform: scaleY(1); } }
  @keyframes draw { 0%,100% { stroke-dashoffset: 1; } 25%,90% { stroke-dashoffset: 0; } }
  @keyframes glow { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes sail { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
  .wheel-spin { transform-origin: 0px 0px; animation: turn 36s linear infinite; }
  .pirate-flag { transform-box: fill-box; transform-origin: left center; animation: sail 6s ease-in-out infinite; }
  text { animation: appear 10s ease-in-out infinite; }
  .motion-bar { transform-box: fill-box; transform-origin: center bottom; animation: rise 10s cubic-bezier(.22,1,.36,1) infinite; }
  .motion-line { stroke-dasharray: 1; animation: draw 10s ease-in-out infinite; }
  .motion-ring { animation: appear 10s ease-in-out infinite; }
  .motion-cell { animation: appear 8s ease-in-out infinite; animation-delay: var(--delay,0ms); }
  .motion-icon { animation: glow 5s ease-in-out infinite; }
  .motion-logo { animation: float 6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><title id="title">One Piece inspired — SELECTED PROJECTS</title><defs><linearGradient id="section"><stop stop-color="#541A2E"/><stop offset=".7" stop-color="#161B2F"/></linearGradient><linearGradient id="project"><stop stop-color="#242F49"/><stop offset="1" stop-color="#384358"/></linearGradient></defs><rect width="960" height="80" rx="14" fill="#161B2F"/><rect x="64" y="15" width="243" height="31" rx="4" fill="#541A2E"/><g transform="translate(24 25) scale(1.1666666666666667)" fill="none" stroke="#FFA586" class="motion-icon" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V4h7l3 3h8v14H3Zm0 4h18"/></g><g font-family="Arial, Helvetica, sans-serif" fill="#E8EDF5"><text x="70" y="35" font-size="17" font-weight="700" letter-spacing="2">SELECTED PROJECTS</text><text x="70" y="58" font-size="13" fill="#B4BED0">Web, mobile, games, and hardware</text></g><g transform="translate(884 40) scale(0.6666666666666666)" fill="none" stroke="#FFA586" class="motion-icon" stroke-width="1.5"><circle r="25"/><path d="M0-30V-23M30 0H23M0 30V23M-30 0H-23"/><path d="m0-19 6 19-6 19-6-19Z" fill="#B51A2B"/><path d="m-18 0 18-6 18 6-18 6Z" fill="#FFA586" stroke="none"/><circle r="3" fill="#161B2F" stroke="none"/></g></svg>
