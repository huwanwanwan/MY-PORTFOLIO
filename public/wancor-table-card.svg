  <text x="48" y="454" fill="#1C1917" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Direct Email</text>
  <text x="250" y="454" fill="#BF4B2F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">militantejuanenricodomanico@gmail.com</text>

  <!-- Bottom Card Footer Bar -->
  <path d="M 0 472 L 800 472 L 800 504 Q 800 520 784 520 L 16 520 Q 0 520 0 504 Z" fill="#F9F8F6"/>
  <line x1="0" y1="472" x2="800" y2="472" stroke="#ECEAE6" stroke-width="1"/>
  <text x="400" y="500" text-anchor="middle" fill="#78716C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
