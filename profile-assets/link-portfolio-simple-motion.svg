<svg xmlns="http://www.w3.org/2000/svg" width="200" height="44" viewBox="0 0 200 44" role="img" aria-labelledby="title"><style>
  @keyframes appear { from { opacity: .25; } to { opacity: 1; } }
  @keyframes rise { from { transform: scaleY(.08); } to { transform: scaleY(1); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes glow { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  text { animation: appear .8s ease-out both; }
  .motion-bar { transform-box: fill-box; transform-origin: center bottom; animation: rise 1.6s cubic-bezier(.22,1,.36,1) both; }
  .motion-line { stroke-dasharray: 1; animation: draw 2.2s ease-out both; }
  .motion-ring { animation: appear 1.8s ease-out both; }
  .motion-cell { animation: appear 1s ease-out both; animation-delay: var(--delay,0ms); }
  .motion-icon { animation: glow 5s ease-in-out infinite; }
  .motion-logo { animation: float 6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><title id="title">Portfolio</title><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#242F49"/><stop offset="1" stop-color="#384358"/></linearGradient><linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#541A2E"/><stop offset="1" stop-color="#161B2F"/></linearGradient></defs><rect width="200" height="44" rx="20" fill="#161B2F"/><g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="198" height="42" rx="12" fill="url(#panel)"/><g transform="translate(17 13) scale(0.75)" fill="none" stroke="#FFA586" class="motion-icon" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V4h7l3 3h8v14H3Zm0 4h18"/></g><text x="115" y="28" fill="#E8EDF5" font-size="13" text-anchor="middle" font-weight="700" letter-spacing="2">PORTFOLIO</text></g></svg>
