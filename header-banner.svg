<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0C0B"/>
      <stop offset="50%" stop-color="#171412"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>

    <!-- Coral Glow Gradient -->
    <radialGradient id="coralGlow" cx="85%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FD4F3C" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#FD4F3C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FD4F3C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="amberGlow" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#FF7A59" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FF7A59" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Coral Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FD4F3C"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(253, 79, 60, 0.25)"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" fill="url(#coralGlow)"/>
  <rect width="1200" height="360" fill="url(#amberGlow)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="none" stroke="rgba(253, 79, 60, 0.28)" stroke-width="2"/>
  <rect x="12" y="12" width="1176" height="336" rx="10" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- Top Status Pill -->
  <g transform="translate(60, 48)">
    <rect width="268" height="30" rx="15" fill="rgba(253, 79, 60, 0.12)" stroke="rgba(253, 79, 60, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#FD4F3C"/>
    <circle cx="16" cy="15" r="7.5" fill="none" stroke="#FD4F3C" stroke-opacity="0.5" stroke-width="1"/>
    <text x="32" y="19" fill="#FF8A65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">WANCOR • PORTFOLIO 2026</text>
  </g>

  <!-- Main Name Title -->
  <text x="60" y="142" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
    Juan Domanico Militante
  </text>

  <!-- Subtitle with Accent Gradient -->
  <text x="60" y="184" fill="url(#accentGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">
    Web &amp; Mobile Developer • Bachelor of Science in Information Technology
  </text>

  <!-- Institution Line -->
  <g transform="translate(60, 206)">
    <text x="0" y="20" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">
      🏛️ Pambayang Dalubhasaan ng Marilao (PDM) &nbsp;•&nbsp; 📍 Bulacan, Philippines &nbsp;•&nbsp; ⚡ Cloudflare Edge SSR
    </text>
  </g>

  <!-- Bottom Badges / Focus Areas -->
  <g transform="translate(60, 268)">
    <!-- Pill 1: Offline Mobile -->
    <rect x="0" y="0" width="220" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="18" y="22" fill="#E7E5E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">📱 Offline-First Mobile (Kotlin)</text>

    <!-- Pill 2: Web Systems -->
    <rect x="232" y="0" width="200" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="250" y="22" fill="#E7E5E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🌐 Full-Stack Web Platforms</text>

    <!-- Pill 3: AR & Game Dev -->
    <rect x="444" y="0" width="180" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="462" y="22" fill="#E7E5E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🎮 Augmented Reality (AR)</text>

    <!-- Pill 4: Hardware IoT -->
    <rect x="636" y="0" width="180" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="654" y="22" fill="#E7E5E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">⚡ Hardware &amp; IoT Sensors</text>
  </g>

  <!-- Right Decorative Icon / Crest -->
  <g transform="translate(1010, 80)">
    <circle cx="70" cy="70" r="68" fill="rgba(253, 79, 60, 0.08)" stroke="rgba(253, 79, 60, 0.35)" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="54" fill="rgba(18, 16, 14, 0.85)" stroke="rgba(253, 79, 60, 0.5)" stroke-width="1.5"/>
    <!-- Stylized W logo -->
    <path d="M 45 48 L 56 94 L 70 64 L 84 94 L 95 48" fill="none" stroke="#FD4F3C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="70" cy="64" r="3" fill="#FF8A65"/>
    <text x="70" y="112" text-anchor="middle" fill="#A8A29E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="2">WANCOR</text>
  </g>
</svg>

