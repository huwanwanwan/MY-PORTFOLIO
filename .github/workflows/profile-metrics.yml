name: Refresh profile metrics

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-profile-metrics.mjs
      - scripts/build-profile-layout.mjs
      - scripts/profile-icons.mjs
      - scripts/profile-tech-logos.mjs
      - scripts/animate-profile-assets.mjs
      - scripts/apply-pirate-theme.mjs
      - scripts/build-reference-profile.mjs
      - profile-assets/pirate-reference-art.png
      - profile-assets/pirate-banner-sharp.png
      - profile-assets/tech-logos/**
      - .github/workflows/profile-metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'huwanwanwan/huwanwanwan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate palette-themed profile assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-profile-metrics.mjs
      - name: Commit refreshed metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-assets/
          if git diff --cached --quiet; then
            echo 'Metrics are unchanged.'
            exit 0
          fi
          git commit -m "Refresh GitHub profile analytics"
          git push
