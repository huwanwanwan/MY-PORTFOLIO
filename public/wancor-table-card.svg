  <text x="48" y="415" fill="#1C1917" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Live Portfolio</text>
  <text x="250" y="415" fill="#BF4B2F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">portfolio.juandomanicomilitante.workers.dev</text>
