<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title"><style>
  @keyframes appear { from { opacity: .25; } to { opacity: 1; } }
  @keyframes rise { from { transform: scaleY(.08); } to { transform: scaleY(1); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes glow { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  text { animation: appear .8s ease-out both; }
  .motion-bar { transform-box: fill-box; transform-origin: center bottom; animation: rise 1.6s cubic-bezier(.22,1,.36,1) both; }
  .motion-line { stroke-dasharray: 1; animation: draw 2.2s ease-out both; }
  .motion-ring { animation: appear 1.8s ease-out both; }
  .motion-cell { animation: appear 1s ease-out both; animation-delay: var(--delay,0ms); }
  .motion-icon { animation: glow 5s ease-in-out infinite; }
  .motion-logo { animation: float 6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><title id="title">About Juan Domanico Militante</title><defs><linearGradient id="section"><stop stop-color="#541A2E"/><stop offset=".7" stop-color="#161B2F"/></linearGradient><linearGradient id="project"><stop stop-color="#242F49"/><stop offset="1" stop-color="#384358"/></linearGradient></defs>
  <rect width="960" height="290" rx="18" fill="#161B2F"/>
  <rect x="96" y="141" width="215" height="30" rx="4" fill="#541A2E"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#B4BED0">
    <text x="28" y="42">I'm <tspan font-weight="700" fill="#E8EDF5">Juan Domanico Militante</tspan>, a <tspan fill="#FFA586">Web and Mobile Developer</tspan></text>
    <text x="28" y="74">and an Information Technology student at</text>
    <text x="28" y="106" font-weight="700" fill="#E8EDF5">Pambayang Dalubhasaan ng Marilao.</text>
    <text x="28" y="164">I have</text><text x="102" y="164" font-weight="700" fill="#FFF5EF">2 years of experience</text>
    <text x="324" y="164">creating websites and mobile applications.</text>
    <text x="28" y="196">I enjoy building <tspan fill="#E8EDF5" font-weight="700">simple, useful, and easy-to-use systems</tspan>, including</text>
